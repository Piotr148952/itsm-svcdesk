services:
  svcdesk:
    build: .
    ports: ["8080:8080"]
    environment:
      SVCDESK_TEST_CLOCK: "1"
    volumes: ["svcdesk-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "-m", "tests.run"]
volumes:
  svcdesk-data:
